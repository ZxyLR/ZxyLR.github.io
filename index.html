const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const gradient=(colors,angle=90)=>'linear-gradient('+angle+'deg,'+colors.join(',')+')';
function makeLayer(name,preset='暮光紫霞',mode='source-over',opacity=100){
 const original={preset,mode,opacity,mapped:true};
 return {id:uid(),name,...original,colors:[...byName(preset).colors],original,visible:true,locked:false,isBase:false,asset:null};
}
function makeBase(){
 const layer=makeLayer('原始图像');
 layer.isBase=true;layer.locked=true;layer.mapped=false;layer.original.mapped=false;
 return layer;
}
let board,boards=[],frame=0,db=null,importTarget=null,exportBoard=null;
function newBoard(number,demo=false){
 const base=makeBase(), layers=[base];
 if(demo)layers.push(makeLayer('渐变映射 01','银盐黑白','soft-light',30),makeLayer('渐变映射 02','暮光紫霞','source-over',85));
 return {id:uid(),number,layers,selected:layers.at(-1).id,serial:demo?2:0,width:32,height:32,zoom:100,comparing:false,family:'全部',page:0,status:'工作台就绪'};
}
const active=()=>board.layers.find(layer=>layer.id===board.selected);
const baseOf=b=>b.layers.find(layer=>layer.isBase);
const referenceOf=b=>baseOf(b)?.asset||b.layers.find(layer=>layer.asset)?.asset;
const titleOf=b=>'工作台 '+String(b.number).padStart(2,'0');
const labelOf=l=>l?.name||'';
function availablePresets(){return board.family==='全部'?allPresets:palettes.filter(p=>p.family===board.family)}
function revealPreset(layer){
 const group=availablePresets(),idx=group.findIndex(p=>p.name===layer?.preset);
 if(idx>=0)board.page=Math.floor(idx/6);
}
function drawTabs(){
 const tabs=$('boardTabs');tabs.replaceChildren();
 for(const item of boards){
  const tab=document.createElement('div');tab.className='board-tab'+(item===board?' active':'');
  const select=document.createElement('button');select.className='tab-name';select.textContent=titleOf(item);
  select.setAttribute('aria-pressed',String(item===board));select.onclick=()=>{board=item;refresh(false);rememberActive()};
  tab.append(select);
  if(boards.length>1){
   const close=document.createElement('button');close.className='icon';close.title=close.ariaLabel='关闭'+titleOf(item);close.innerHTML=icon('x');
   close.onclick=()=>{if(!confirm('关闭并删除'+titleOf(item)+'及其图层？'))return;
    const idx=boards.indexOf(item);boards.splice(idx,1);
    if(board===item)board=boards[Math.max(0,idx-1)];removeSaved(item);rememberActive();refresh(false)};
   tab.append(close);
  }
  tabs.append(tab);
 }
}
function readSize(prefix){
 const fields=[$(prefix+'W'),$(prefix+'H')];
 for(const field of fields)if(!field.reportValidity())return null;
 return {width:fields[0].valueAsNumber,height:fields[1].valueAsNumber};
}
$('addBoard').onclick=()=>{
 $('newW').value=$('newH').value=32;$('createDialog').showModal();$('newW').focus();
};
$('cancelCreate').onclick=()=>$('createDialog').close();
function openNewWorkspace(size,asset=null){
 const next=Object.assign(newBoard(Math.max(...boards.map(b=>b.number))+1),size);
 if(asset){
  const base=baseOf(next);
  base.asset=asset;
  addImportLayers(next,base);
  next.status=asset.name+' 已导入新工作台';
 }
 activateWorkspace(next);
}
function activateWorkspace(next){
 boards.push(next);board=next;rememberActive();refresh();
 $('boardTabs').lastElementChild?.scrollIntoView?.({block:'nearest',inline:'nearest'});
}
$('createForm').onsubmit=e=>{
 e.preventDefault();const size=readSize('new');if(!size)return;
 $('createDialog').close();openNewWorkspace(size);
};
function renderLayers(){
 const holder=$('layerList');holder.replaceChildren();
 for(const layer of [...board.layers].reverse()){
  const row=document.createElement('div');row.className='layer'+(layer===active()?' selected':'')+(layer.visible?'':' off');
  row.setAttribute('role','button');row.tabIndex=0;row.setAttribute('aria-label','选择'+layer.name);row.setAttribute('aria-pressed',String(layer===active()));
  row.innerHTML='<span class="thumb"></span><div class="layer-text"><div class="layer-name"></div><div class="layer-desc"></div></div>'+(layer.isBase?'<button class="icon lock-toggle"></button>':'')+'<button class="icon eye"></button>';
  row.querySelector('.layer-name').textContent=layer.name;
  row.querySelector('.layer-desc').textContent=(layer.asset?layer.asset.name+' · ':'')+(layer.mode==='clip'?'剪辑蒙版':modes[layer.mode])+' · '+layer.opacity+'%';
  const thumb=row.querySelector('.thumb');thumb.style.backgroundImage=layer.asset?'url("'+layer.asset.thumb+'")':gradient(layer.kind==='spectrum'?spectrumStops:layer.colors,layer.kind==='spectrum'?90+layer.angle:130);
  const lock=row.querySelector('.lock-toggle');
  if(lock){lock.innerHTML=icon(layer.locked?'lock':'unlock');lock.title=lock.ariaLabel=(layer.locked?'解锁':'锁定')+'原始图像图层';
   lock.onclick=e=>{e.stopPropagation();layer.locked=!layer.locked;board.selected=layer.id;refresh()}}
  const eye=row.querySelector('.eye');eye.innerHTML=icon(layer.visible?'eye':'off');eye.title=eye.ariaLabel=(layer.visible?'隐藏':'显示')+layer.name;
  eye.onclick=e=>{e.stopPropagation();layer.visible=!layer.visible;refresh()};
  const choose=()=>{board.selected=layer.id;revealPreset(layer);refresh()};
  row.onclick=choose;row.onkeydown=e=>{if(e.target===row&&['Enter',' '].includes(e.key)){e.preventDefault();choose()}};
  holder.append(row);
 }
 $('layerCount').textContent=board.layers.length;
 const current=active(),idx=board.layers.indexOf(current);
 for(const id of ['duplicate','remove'])$(id).disabled=!current||current.locked;
 $('up').disabled=!canMove(idx,1);$('down').disabled=!canMove(idx,-1);$('reset').disabled=!current||current.locked;
}
function canMove(index,delta){
 const layer=board.layers[index],neighbor=board.layers[index+delta];return layer&&!layer.locked&&neighbor&&!neighbor.locked;
}
function renderPresets(){
 const bar=$('families');bar.replaceChildren();
 for(const family of ['全部',...Object.keys(families)]){
  const button=document.createElement('button');button.className='family';button.setAttribute('aria-pressed',String(board.family===family));
  if(families[family]){const dot=document.createElement('i');dot.className='family-dot';dot.style.setProperty('--tone',families[family][0]);button.append(dot)}
  button.append(family);button.onclick=()=>{board.family=family;board.page=0;renderPresets();saveLater(board)};bar.append(button);
 }
 const choices=availablePresets(),holder=$('presets');holder.replaceChildren();$('presetCount').textContent=choices.length;
 for(const preset of choices.slice(board.page*6,board.page*6+6)){
  const chosen=active()?.mapped&&preset.name===active()?.preset,btn=document.createElement('button');
  btn.className='preset'+(chosen?' selected':'');btn.setAttribute('aria-pressed',String(!!chosen));btn.title='应用'+preset.name;
  btn.innerHTML='<span class="preset-swatch">'+(chosen?'<span class="check">'+icon('check')+'</span>':'')+'</span><span class="preset-name"></span>';
  btn.firstChild.style.backgroundImage=gradient(preset.colors,120);btn.lastChild.textContent=preset.name;
  btn.onclick=()=>{let layer=active();if(!layer||layer.locked||layer.kind==='spectrum')layer=insertAdjustment(preset.name);
   Object.assign(layer,{colors:[...preset.colors],preset:preset.name,mapped:true});board.comparing=false;refresh()};
  holder.append(btn);
 }
 $('prev').disabled=board.page===0;$('next').disabled=(board.page+1)*6>=choices.length;
}
function renderProperties(){
 const layer=active();$('propBody').hidden=!layer;$('baseNote').hidden=!!layer;if(!layer)return;
 const spectrum=layer.kind==='spectrum';
 $('gradientEditor').hidden=spectrum;$('spectrumEditor').hidden=!spectrum;
 const clipOption=$('blend').querySelector('option[value="clip"]');
 clipOption.hidden=clipOption.disabled=!spectrum;
 if(spectrum){$('angle').value=layer.angle;$('colorRange').value=layer.range||'hue'}
 $('sourceName').textContent=layer.asset?layer.asset.name+' · '+layer.asset.image.width+' × '+layer.asset.image.height:spectrum?'RGB 色谱填充':(layer.isBase?'尚未导入图片':'使用下方图层的合成结果');
 $('layerImport').lastElementChild.textContent=layer.asset?'更换图片':'导入图片';
 $('mapping').checked=layer.mapped;$('mapping').disabled=layer.locked;$('reverse').disabled=!layer.mapped||layer.locked;
 $('blend').disabled=$('opacity').disabled=layer.locked;$('blend').value=layer.mode;$('opacity').value=layer.opacity;
 setOpacityDisplay();const ramp=$('ramp');ramp.replaceChildren();ramp.style.background=gradient(layer.colors);ramp.classList.toggle('inactive',!layer.mapped);
 layer.colors.forEach((color,i)=>{
  const stop=document.createElement('label');stop.className='stop';stop.title='编辑色标 '+(i+1);stop.style.left=(100*i/(layer.colors.length-1))+'%';stop.style.setProperty('--c',color);
  const picker=document.createElement('input');picker.type='color';picker.value=color;picker.ariaLabel=stop.title;picker.disabled=layer.locked||!layer.mapped;
  picker.oninput=()=>{layer.colors[i]=picker.value;layer.preset=null;stop.style.setProperty('--c',picker.value);ramp.style.background=gradient(layer.colors);renderLayers();renderPresets();schedule();saveLater(board)};
  stop.append(picker);ramp.append(stop);
 });
}
function setOpacityDisplay(){const value=active()?.opacity??100;$('opacityOut').value=value+'%';$('opacity').style.setProperty('--amount',value+'%')}
function insertAdjustment(preset){
 const layer=makeLayer('渐变映射 '+String(++board.serial).padStart(2,'0'),preset);
 board.layers.splice(board.layers.indexOf(active())+1,0,layer);board.selected=layer.id;return layer;
}
const spectrumStops=['#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff','#ff0000'];
$('blend').add(new Option('剪辑蒙版','clip'));
['→','↘','↓','↙','←','↖','↑','↗'].forEach((arrow,i)=>$('angle').add(new Option(arrow+'  '+(45*i)+'°',45*i)));
$('angle').onchange=e=>{active().angle=Number(e.target.value);refresh()};
$('colorRange').onchange=e=>{active().range=e.target.value;refresh()};
function makeRainbow(workspace){
 const layer=makeLayer('彩虹蒙版 '+String(++workspace.serial).padStart(2,'0'),'暮光紫霞','clip');
 Object.assign(layer,{kind:'spectrum',angle:0,range:'hue',mapped:false});
 Object.assign(layer.original,{angle:0,range:'hue',mapped:false});
 return layer;
}
function addImportLayers(workspace,imported){
 const rainbow=makeRainbow(workspace);
 if(imported.mode==='clip')rainbow.asset=imported.asset;
 workspace.layers.splice(workspace.layers.indexOf(imported)+1,0,rainbow);

 const base=baseOf(workspace);
 const source=base?.asset?base:imported;
 const copy=makeLayer(source.name+' 副本 · 明度','暮光紫霞','luminosity');
 copy.asset=source.asset;
 copy.mapped=false;
 copy.original.mapped=false;
 workspace.layers.push(copy);
 workspace.selected=copy.id;
}
$('addRainbow').onclick=()=>{
 const layer=makeRainbow(board);
 board.layers.splice(board.layers.indexOf(active())+1,0,layer);board.selected=layer.id;board.comparing=false;refresh();
};
$('add').onclick=()=>{insertAdjustment(active()?.preset||'暮光紫霞');refresh()};
$('duplicate').onclick=()=>{
 const src=active();if(!src||src.locked)return;
 const layer={...src,id:uid(),name:src.name+' 副本',isBase:false,locked:false,colors:[...src.colors],original:{...src.original}};
 board.layers.splice(board.layers.indexOf(src)+1,0,layer);board.selected=layer.id;refresh();
